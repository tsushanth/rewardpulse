name: RewardPulse
options:
  bundleIdPrefix: com.appfactory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "4.43.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.29.0"
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "17.3.0"

targets:
  RewardPulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RewardPulse
        excludes:
          - "**/*.md"
          - "Info.plist"
          - "RewardPulse.entitlements"
          - "PrivacyInfo.xcprivacy"
    resources:
      - path: RewardPulse/Resources
      - path: RewardPulse/PrivacyInfo.xcprivacy
    info:
      path: RewardPulse/Info.plist
      properties:
        NSUserNotificationsUsageDescription: "We'll notify you when new surveys are available and before your streak expires."
        NSUserTrackingUsageDescription: "Tracking helps personalize your survey matches so you earn more and qualify more often."
        FacebookAppID: "$(FACEBOOK_APP_ID)"
        FacebookClientToken: "$(FACEBOOK_CLIENT_TOKEN)"
        FacebookDisplayName: "RewardPulse"
        LSApplicationQueriesSchemes:
          - fbapi
          - fb-messenger-share-api
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.appfactory.rewardpulse
        UILaunchScreen:
          UIColorName: "Background"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
          - fetch
    entitlements:
      path: RewardPulse/RewardPulse.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appfactory.rewardpulse
        INFOPLIST_FILE: RewardPulse/Info.plist
        CODE_SIGN_ENTITLEMENTS: RewardPulse/RewardPulse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FACEBOOK_APP_ID: "0"
        FACEBOOK_CLIENT_TOKEN: "placeholder"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseAnalytics
      - package: Facebook
        product: FacebookCore
      - sdk: AdServices.framework
      - sdk: AuthenticationServices.framework
      - sdk: StoreKit.framework

  RewardPulseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RewardPulseTests
    dependencies:
      - target: RewardPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appfactory.rewardpulse.tests

schemes:
  RewardPulse:
    build:
      targets:
        RewardPulse: all
        RewardPulseTests: [test]
    run:
      config: Debug
      storeKitConfiguration: RewardPulse.storekit
    test:
      config: Debug
      targets:
        - RewardPulseTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
